<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Arc Path: left to right over top (clockwise) -->
    <path id="topArc" d="M 72,250 A 178,178 0 0,1 428,250" fill="none" />
    
    <!-- Bottom Arc Path: left to right under bottom (counter-clockwise sweep 0) for upright text -->
    <path id="bottomArc" d="M 45,250 A 205,205 0 0,0 455,250" fill="none" />

    <!-- Classic Brand Gold Gradient (#FFD700) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>

    <!-- Subtle Premium Gold Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFD700" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Solid Deep Black Circular Base -->
  <circle cx="250" cy="250" r="248" fill="#000000" />

  <!-- Outer Heavy Classic Gold Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
  
  <!-- Decorative Beaded Gold Inner Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#FFD700" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="3 3" />

  <!-- Inner Crest Ring & Background -->
  <circle cx="250" cy="250" r="148" fill="#030303" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Arc Text: THE DEVOTED ONES -->
  <text fill="#FFD700" font-size="25" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" letter-spacing="4.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      THE DEVOTED ONES
    </textPath>
  </text>

  <!-- Side cross accents at 9 o clock and 3 o clock -->
  <g fill="#FFD700">
    <path d="M 64,242 H 68 V 247 H 74 V 251 H 68 V 258 H 64 V 251 H 58 V 247 H 64 Z" />
    <circle cx="66" cy="249" r="1.5" fill="#F00020" />

    <path d="M 432,242 H 436 V 247 H 442 V 251 H 436 V 258 H 432 V 251 H 426 V 247 H 432 Z" />
    <circle cx="434" cy="249" r="1.5" fill="#F00020" />
  </g>

  <!-- Bottom Arc Text: THE DEVOTED ONES (Upright & Crisp) -->
  <text fill="#FFD700" font-size="25" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" letter-spacing="4.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      THE DEVOTED ONES
    </textPath>
  </text>

  <!-- Center TDO Monogram Emblem (Bold, Geometric, Distinctive) -->
  <g id="centerMonogram" filter="url(#subtleGlow)">
    <!-- Small red accent cross above monogram -->
    <path d="M 248,154 H 252 V 160 H 258 V 164 H 252 V 172 H 248 V 164 H 242 V 160 H 248 Z" fill="#F00020" />

    <!-- 'T' Letter (Sturdy with cross aesthetic) -->
    <path d="
      M 144,188
      L 216,188
      L 216,215
      L 194,215
      L 194,312
      L 166,312
      L 166,215
      L 144,215
      Z
    " fill="url(#goldGrad)" />

    <!-- 'D' Letter (Chamfered geometric cuts) -->
    <path d="
      M 214,188
      L 258,188
      L 286,216
      L 286,284
      L 258,312
      L 214,312
      Z
      M 238,214
      L 252,214
      L 264,226
      L 264,274
      L 252,286
      L 238,286
      Z
    " fill="url(#goldGrad)" fill-rule="evenodd" />

    <!-- 'O' Letter (Octagonal faceted with pill counter) -->
    <path d="
      M 298,206
      L 318,188
      L 344,188
      L 364,206
      L 364,294
      L 344,312
      L 318,312
      L 298,294
      Z
      M 322,214
      L 340,214
      L 346,222
      L 346,278
      L 340,286
      L 322,286
      L 316,278
      L 316,222
      Z
    " fill="url(#goldGrad)" fill-rule="evenodd" />
  </g>
</svg>
